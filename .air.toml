# .air.toml — Air live reload configuration for ShikaGari development
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/shikagari ./cmd/api"
  bin = "./tmp/shikagari"
  include_ext = ["go", "env"]
  exclude_dir  = ["tmp", "uploads", "vendor", "migrations"]
  delay        = 1000  # ms before rebuild triggers

[log]
  time = true

[color]
  main    = "magenta"
  watcher = "cyan"
  build   = "yellow"
  runner  = "green"

[misc]
  clean_on_exit = true